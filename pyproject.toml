[project]
name = "plantpipeline"
version = "0.1.0"
description = "Baseline data pipeline: Pheno4D laser scans -> fixed-size, soil-free, time-indexed point clouds."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pykdtree>=1.3",
    "fpsample>=0.3",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
view = ["open3d>=0.19", "matplotlib>=3.8"]

[project.scripts]
plantpipeline = "plantpipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plantpipeline"]

